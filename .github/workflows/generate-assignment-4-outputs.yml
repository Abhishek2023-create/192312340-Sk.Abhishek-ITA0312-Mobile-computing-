name: Generate Assignment 4 Python output screenshots
on:
  push:
    paths:
      - 'assignment 4/**'
      - '.github/workflows/generate-assignment-4-outputs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Run all twelve Python programs and create genuine console screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys,textwrap
          from PIL import Image,ImageDraw,ImageFont
          scripts=sorted(Path('assignment 4').rglob('question_*.py'))
          assert len(scripts)==12, f'Expected 12 scripts; found {len(scripts)}'
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf',18)
          bold=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf',20)
          for script in scripts:
              p=subprocess.run([sys.executable,script.name],cwd=script.parent,capture_output=True,text=True,timeout=90)
              if p.returncode: raise RuntimeError(f'{script} failed: {p.stdout}\n{p.stderr}')
              lines=['$ python '+script.name,'']+(p.stdout+p.stderr).splitlines()+['','Process finished with exit code 0']
              wrapped=[]
              for line in lines: wrapped.extend(textwrap.wrap(line,width=96,replace_whitespace=False,drop_whitespace=False) or [''])
              w,h=1300,max(240,100+29*len(wrapped))
              im=Image.new('RGB',(w,h),'#111827')
              draw=ImageDraw.Draw(im)
              draw.rounded_rectangle((12,12,w-12,h-12),radius=16,fill='#17212f')
              draw.rectangle((12,12,w-12,65),fill='#263445')
              draw.text((28,29),'Actual Python console output - '+str(script.parent.relative_to(Path('assignment 4'))),font=bold,fill='#ffffff')
              for i,line in enumerate(wrapped): draw.text((30,82+i*29),line,font=font,fill='#a7f3d0' if i==0 else '#e5e7eb')
              im.save(script.parent/'output.png')
              print('PASS',script)
          PY
      - name: Commit output PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assignment 4'
          if ! git diff --cached --quiet; then
            git commit -m "Add verified Python console screenshots for Assignment 4"
            git push
          fi
